<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문법 추가문제 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 학생 신청은 한 열 흐름(장별 유형 체크), 선생님 발행은 왼쪽 신청 목록 + 오른쪽 B5 미리보기 */
:root{
  --bg:#f8f6fd; --surface:#ffffff; --ink:#1b2550; --muted:#5f6684; --line:#e2dcf1;
  --accent:#1f2b63; --accent-ink:#ffffff; --mark:#fff0a6; --mark-ink:#1b2550;
  --lav:#e7e0fb; --lav-ink:#4a3c8c; --pink:#ffdbe6; --pink-ink:#9a3457; --pink-soft:#fff0f5; --yel:#fff4c4;
  --ok:#4a3c8c; --warn:#b03a63; --soft:#efeafc;
  --f-ui:"Gothic A1","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121633; --surface:#1b2045; --ink:#eceafb; --muted:#a7a9c9; --line:#2f3566;
  --accent:#b9b0f5; --accent-ink:#121633; --mark:#e8d36a; --mark-ink:#121633;
  --lav:#2e2a5c; --lav-ink:#d3caff; --pink:#4a2840; --pink-ink:#ffc2d6; --pink-soft:#2c2347; --yel:#3b3620;
  --ok:#c9bfff; --warn:#ff9fbd; --soft:#262b57; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121633; --surface:#1b2045; --ink:#eceafb; --muted:#a7a9c9; --line:#2f3566;
  --accent:#b9b0f5; --accent-ink:#121633; --mark:#e8d36a; --mark-ink:#121633;
  --lav:#2e2a5c; --lav-ink:#d3caff; --pink:#4a2840; --pink-ink:#ffc2d6; --pink-soft:#2c2347; --yel:#3b3620;
  --ok:#c9bfff; --warn:#ff9fbd; --soft:#262b57; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.stk-hd{width:72px;height:auto;flex:none}
.stk-cheer{width:96px;height:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(31,43,99,.15))}
.result-top{display:flex;align-items:center;gap:14px}
.empty img{width:96px;height:auto;display:block;margin:0 auto 8px}
.brand h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
.brand h1 mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;padding:0 2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-ui);padding:8px 16px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:12px}
label.field,div.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 160px;min-width:0}
input[type=text],textarea,select{font:15px var(--f-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:120px;resize:vertical;font-family:var(--f-code);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;background:var(--bg)}
.seg input{accent-color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--soft);font-weight:600}
h2.sec{font-size:15px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
h2.sec small{color:var(--muted);font-weight:400;font-size:13px}
.chapter{margin-bottom:14px}
.book{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;border-top:2px solid var(--ink);padding-top:10px;margin:26px 0 12px}
.book:first-child{margin-top:4px}
.book b{font-size:17px;font-weight:800}
.book span{font-size:13px;color:var(--muted)}
.chapter h3{display:inline-block;font-size:13px;letter-spacing:.02em;color:var(--lav-ink);background:var(--lav);border-radius:999px;padding:3px 12px;margin:0 0 8px;font-weight:700}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.type{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg);min-width:0}
.type input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.type:has(input:checked){border-color:var(--accent);background:var(--yel)}
.type .nm{font-weight:600;font-size:14px;line-height:1.4}
.type .meta{font-size:12px;color:var(--muted);margin-top:2px}
.type .rule{font-family:var(--f-code);font-size:11px;color:var(--accent);font-weight:700}
.bar{position:sticky;bottom:0;margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.count{font-size:14px}.count b{font-size:18px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:700 14px var(--f-ui);padding:10px 18px;border-radius:9px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.result{margin-top:16px;border:0;border-radius:18px;padding:20px;background:var(--pink-soft);box-shadow:0 6px 20px rgba(31,43,99,.10)}
.result .code{font-family:var(--f-code);font-size:26px;font-weight:700;letter-spacing:.04em;background:var(--mark);color:var(--mark-ink);display:inline-block;padding:4px 12px;border-radius:6px;margin:6px 0 10px;word-break:break-all}
.result .msg{font-family:var(--f-code);font-size:13px;background:var(--surface);border:0;border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;user-select:all}
.hint{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;border:0;border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--ink)}
.teacher{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.teacher{grid-template-columns:minmax(0,1fr)}}
.reqs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.req{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);min-width:0}
.req.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);background:var(--yel)}
.req input{accent-color:var(--accent);margin-top:4px}
.req .who{font-weight:700}
.req .tag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px}
.tag.R{background:var(--pink);color:var(--pink-ink)}.tag.P{background:var(--lav);color:var(--lav-ink)}
.req .sub{font-size:12px;color:var(--muted);word-break:break-all}
.req .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.err{color:var(--warn);font-size:13px;margin-top:6px}
.previewbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.stage{background:var(--soft);border-radius:12px;padding:14px;overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat:nth-child(1){background:var(--lav)}.stat:nth-child(2){background:var(--yel)}.stat:nth-child(3){background:var(--pink-soft)}.stat:nth-child(4){background:var(--pink)}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.rfilter{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tablewrap{overflow-x:auto}
.rtable{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
.rtable th{text-align:left;font-weight:700;color:var(--lav-ink);background:var(--lav);padding:8px;white-space:nowrap}
.rtable th:first-child{border-radius:8px 0 0 8px}.rtable th:last-child{border-radius:0 8px 8px 0}
.rtable td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.rtable td.nw,.rtable td.nw *{white-space:nowrap}
.rtable .tag{font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap}
.rtable td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.rtable input.sc{width:56px;padding:5px 6px;font-variant-numeric:tabular-nums}
.rtable input.memo{min-width:120px;padding:5px 8px;font-size:13px}
.rtable .tys{display:flex;flex-wrap:wrap;gap:4px;max-width:320px}
.rtable .tys span{background:var(--soft);border-radius:999px;padding:1px 8px;font-size:11.5px}
.pill{display:inline-block;white-space:nowrap;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.ok{background:var(--lav);color:var(--lav-ink)}.pill.no{background:var(--pink);color:var(--pink-ink)}.pill.wait{background:var(--soft);color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.tbar{display:grid;grid-template-columns:minmax(0,260px) 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.tbar .meter{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.tbar .meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.tbar .n{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.empty{border:2px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}
.steps{margin:8px 0 0;padding-left:1.4em;font-size:13px;color:var(--muted)}
.steps li{padding-left:.2em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{-webkit-text-size-adjust:100%}

[hidden]{display:none!important}
/* 학생 신청: 문법 탭 + 장바구니 */
.info .row{align-items:flex-end}
.picker{display:grid;grid-template-columns:190px minmax(0,1fr) 300px;gap:16px;align-items:start;margin-top:18px}
.gtabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.gtab{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-ui);padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left}
.gtab:hover{border-color:var(--accent)}
.gtab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gtab .badge{min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:var(--pink-ink);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.gtab .badge[hidden]{display:none}
.glist{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.glist h3{margin:0 0 4px;font-size:18px}
.glist .sub{margin:0 0 12px;font-size:13px;color:var(--muted)}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-width:0}
.titem.on{background:var(--yel);border-color:var(--accent)}
.titem .nm{font-weight:700;font-size:14.5px;line-height:1.4}
.titem .meta{font-size:12px;color:var(--muted);margin-top:2px}
.titem .rule{font-family:var(--f-code);font-size:11px;color:var(--lav-ink);font-weight:700}
.addbtn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);font:700 13px var(--f-ui);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.titem.on .addbtn{background:var(--accent);color:var(--accent-ink)}
.cart{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(31,43,99,.08)}
.cart-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.cart-h b{font-size:16px}
.cart-h .tot{font-size:12px;color:var(--muted)}
.resetbtn{border:0;background:none;color:var(--pink-ink);font:700 13px var(--f-ui);cursor:pointer;padding:2px 4px}
.resetbtn:disabled{color:var(--muted);opacity:.5;cursor:default}
.citems{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.citems li{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--lav);color:var(--lav-ink);border-radius:10px;padding:7px 8px 7px 10px;font-size:13px;font-weight:600}
.citems li small{display:block;font-weight:500;opacity:.8;font-size:11px}
.citems .x{border:0;background:var(--surface);color:var(--lav-ink);width:24px;height:24px;border-radius:12px;cursor:pointer;font-size:15px;line-height:1}
.cempty{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:14px;text-align:center;margin-bottom:12px}
.cart .btn{width:100%;padding:12px}
.cart .need{font-size:12px;color:var(--pink-ink);margin:8px 0 0;text-align:center}
.mbar{display:none}
.modal{position:fixed;inset:0;background:rgba(18,22,51,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:20}
.modal .result{margin-top:0;max-width:640px;width:100%}
.closebtn{border:0;background:var(--surface);color:var(--ink);font:700 13px var(--f-ui);padding:8px 14px;border-radius:999px;cursor:pointer}
@media (max-width:900px){
  .picker{grid-template-columns:minmax(0,1fr)}
  .gtabs{flex-direction:row;overflow-x:auto;padding:4px 0 8px;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:thin}
  .gtab{flex:none}
  .cart{display:none}
  .cart.open{display:block;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));top:auto;z-index:15;max-height:60vh;overflow:auto}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:16;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(31,43,99,.08)}
  .mbar .cnt{border:0;background:var(--lav);color:var(--lav-ink);font:700 14px var(--f-ui);padding:10px 14px;border-radius:999px;cursor:pointer}
  .wrap{padding-bottom:90px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img class="stk-hd" id="stk-hd" alt="">
      <div><h1>문법 <mark>추가문제</mark> 신청</h1>
      <p>틀린 문법을 골라 담고 신청해요 · 유형마다 15문항</p></div>
    </div>
  </header>

  <div class="panel info">
    <div class="row">
      <label class="field">이름<input type="text" id="s-name" placeholder="예: 김최선" maxlength="12" autocomplete="off"></label>
      <div class="field">반<div class="seg"><label><input type="radio" name="cls" id="c-1" value="월금반"> 월금반</label><label><input type="radio" name="cls" id="c-2" value="월수반"> 월수반</label><label><input type="radio" name="cls" id="c-3" value="화목반"> 화목반</label></div></div>
      <div class="field">신청 이유<div class="seg"><label><input type="radio" name="reason" id="r-R" value="R" checked> 통과 못 해서 다시</label><label><input type="radio" name="reason" id="r-P" value="P"> 더 연습하고 싶어서</label></div></div>
    </div>
  </div>

  <div class="picker">
    <nav class="gtabs" id="gtabs" role="tablist" aria-label="문법 단원"></nav>
    <section class="glist" id="glist" role="tabpanel"></section>
    <aside class="cart" id="cart" aria-label="담은 문법"></aside>
  </div>
</div>
<div class="mbar"><button class="cnt" id="m-cnt" type="button">담은 문법 0개 ▲</button><button class="btn" id="m-go" type="button" disabled>신청하기</button></div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const B36 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function chk(s){let n=0;for(const c of s)n=(n*31+c.charCodeAt(0))%36;return B36[n];}
function encode(reason, idxs, seed){let m=0n; idxs.forEach(i=>m|=(1n<<BigInt(i)));const body=reason+m.toString(36).toUpperCase();return `GR-${body}-${seed}${chk(body+seed)}`;}
function newSeed(){let s='';const a=new Uint32Array(4);crypto.getRandomValues(a);for(const v of a)s+=B36[v%36];return s;}
const refs=t=>t.gs?`본교재 ${esc(t.gs)}`:'';
const short=n=>n.split(' (')[0];

const gm={};
TYPES.forEach((t,i)=>{if(t.hidden)return;(gm[t.g]=gm[t.g]||{g:t.g,name:t.group,list:[]}).list.push(i);});
const GROUPS=Object.values(gm).sort((a,b)=>a.g-b.g);
GROUPS.forEach(g=>g.list.sort((a,b)=>TYPES[a].gk-TYPES[b].gk));
const sel=new Set(); let cur=0;

function renderTabs(){
  $('#gtabs').innerHTML=GROUPS.map((g,k)=>{const n=g.list.filter(i=>sel.has(i)).length;
    return `<button class="gtab" role="tab" type="button" id="gt-${k}" data-k="${k}" aria-selected="${k===cur}"><span>${esc(g.name)}</span><span class="badge" ${n?'':'hidden'}>${n}</span></button>`;}).join('');
}
function renderList(){
  const g=GROUPS[cur];
  $('#glist').innerHTML=`<h3>${esc(g.name)}</h3><p class="sub">틀린 문법을 ‘담기’로 골라 주세요. 다른 단원 탭에서도 계속 담을 수 있어요.</p>
  <div class="tlist">${g.list.map(i=>{const t=TYPES[i],on=sel.has(i);
    return `<div class="titem${on?' on':''}"><div style="min-width:0">${t.src==='GS'&&t.rule?`<div class="rule">${esc(t.rule)}</div>`:''}<div class="nm">${esc(t.name)}</div>${refs(t)?`<div class="meta">${refs(t)}</div>`:''}</div>
      <button class="addbtn" type="button" data-i="${i}" aria-pressed="${on}">${on?'담김 ✓':'담기'}</button></div>`;}).join('')}</div>`;
}
function ready(){return sel.size&&$('#s-name').value.trim()&&document.querySelector('input[name=cls]:checked');}
function renderCart(){
  const items=GROUPS.flatMap(g=>g.list.filter(i=>sel.has(i)).map(i=>[i,g.name]));
  const miss=[]; if(!$('#s-name').value.trim())miss.push('이름'); if(!document.querySelector('input[name=cls]:checked'))miss.push('반');
  $('#cart').innerHTML=`<div class="cart-h"><div><b>담은 문법 ${items.length}개</b><div class="tot">총 ${items.length*15}문항</div></div><button class="resetbtn" id="c-reset" type="button" ${items.length?'':'disabled'}>전체 리셋</button></div>
    ${items.length?`<ul class="citems">${items.map(([i,gn])=>`<li><span>${esc(short(TYPES[i].name))}<small>${esc(gn)}</small></span><button class="x" type="button" data-rm="${i}" aria-label="${esc(short(TYPES[i].name))} 빼기">×</button></li>`).join('')}</ul>`
      :'<div class="cempty">아직 담은 문법이 없어요.<br>왼쪽 단원 탭에서 골라 담아 주세요.</div>'}
    <button class="btn" id="c-go" type="button" ${ready()?'':'disabled'}>신청하기</button>
    ${items.length&&miss.length?`<p class="need">${miss.join('과 ')}을(를) 입력해 주세요</p>`:''}`;
  $('#m-cnt').textContent=`담은 문법 ${items.length}개 ${$('#cart').classList.contains('open')?'▼':'▲'}`;
  $('#m-go').disabled=!ready();
}
function renderAll(){renderTabs();renderList();renderCart();}
$('#gtabs').addEventListener('click',e=>{const b=e.target.closest('.gtab');if(!b)return;cur=+b.dataset.k;renderTabs();renderList();
  if(window.innerWidth<=900){b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}});
$('#gtabs').addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();
  cur=(cur+(e.key==='ArrowDown'||e.key==='ArrowRight'?1:-1)+GROUPS.length)%GROUPS.length;renderTabs();renderList();$('#gt-'+cur).focus();});
$('#glist').addEventListener('click',e=>{const b=e.target.closest('.addbtn');if(!b)return;const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);renderAll();
  const nb=document.querySelector(`.addbtn[data-i="${i}"]`); if(nb)nb.focus();});
$('#cart').addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]'); if(rm){sel.delete(+rm.dataset.rm);renderAll();return;}
  const rs=e.target.closest('#c-reset'); if(rs){
    if(rs.dataset.confirm!=='1'){rs.dataset.confirm='1';rs.textContent='정말 비울까요?';setTimeout(()=>{if(document.body.contains(rs)){rs.dataset.confirm='';rs.textContent='전체 리셋';}},2500);return;}
    sel.clear();renderAll();return;}
  if(e.target.closest('#c-go'))submit();
});
$('#m-cnt').addEventListener('click',()=>{$('#cart').classList.toggle('open');renderCart();});
$('#m-go').addEventListener('click',()=>submit());
$('#s-name').addEventListener('input',renderCart);
document.querySelectorAll('input[name=cls]').forEach(r=>r.addEventListener('change',renderCart));

const FORM='https://docs.google.com/forms/d/e/1FAIpQLSfWmpnlx-GRJSine9w3w9N9VKSK3byMgvGfgLP_BdqMXK-iWQ/formResponse';
const F={name:'entry.1855886737',cls:'entry.30406000',reason:'entry.607849720',code:'entry.462544049'};
async function sendForm(name,cls,reason,code){
  const body=new URLSearchParams({[F.name]:name,[F.cls]:cls,[F.reason]:reason==='R'?'재시험':'추가 연습',[F.code]:code});
  await fetch(FORM,{method:'POST',mode:'no-cors',body});
}
function submit(){
  if(!ready())return;
  const name=$('#s-name').value.trim().replace(/\|/g,''), cls=document.querySelector('input[name=cls]:checked').value;
  const reason=document.querySelector('input[name=reason]:checked').value;
  const idxs=[...sel].sort((a,b)=>a-b); const code=encode(reason,idxs,newSeed());
  const msg=`문법추가 | ${name} | ${cls} | ${code}`;
  const m=$('#modal'); m.hidden=false; $('#cart').classList.remove('open');
  document.querySelectorAll('#c-go,#m-go').forEach(b=>b.disabled=true);
  m.innerHTML=`<div class="result" role="dialog" aria-modal="true" aria-label="신청 결과">
    <div class="result-top"><img class="stk-cheer" src="${STK['3']}" alt=""><div><div style="font-weight:800;font-size:17px" id="s-state">선생님께 보내는 중…</div>
    <div class="hint">${esc(name)} · ${esc(cls)}</div><div class="code">${code}</div></div></div>
    <div class="chips">${idxs.map(i=>`<span class="chip">${esc(short(TYPES[i].name))}</span>`).join('')}</div>
    <p style="margin:14px 0 6px;font-weight:600" id="s-sub">잠시만 기다려 주세요.</p>
    <div class="row" style="margin-top:12px;gap:8px;justify-content:space-between"><button class="btn sm ghost" id="s-copy" type="button">신청 코드 복사</button><button class="closebtn" id="s-close" type="button">닫기</button></div>
    <p class="hint" style="margin:8px 0 0">혹시 선생님 목록에 이름이 없다고 하면, 위 신청 코드를 복사해서 선생님께 보내 주세요.</p></div>`;
  $('#s-copy').onclick=async()=>{try{await navigator.clipboard.writeText(msg);$('#s-copy').textContent='복사됨 ✓';}catch(e){$('#s-copy').textContent=code;}};
  sendForm(name,cls,reason,code).then(()=>{
    $('#s-state').textContent='신청 완료! 끝까지 화이팅 💪';
    $('#s-sub').textContent='선생님께 자동으로 전달됐어요. 시험지가 나오면 선생님이 나눠 주실 거예요.';
    sel.clear(); renderAll();
  }).catch(()=>{
    $('#s-state').textContent='전송이 안 됐어요 😢';
    $('#s-sub').textContent='인터넷 연결을 확인하고 다시 신청하거나, 신청 코드를 복사해서 선생님께 보내 주세요.';
    renderCart();
  });
  $('#s-close').onclick=()=>{m.hidden=true;m.innerHTML='';};
  m.onclick=e=>{if(e.target===m){m.hidden=true;m.innerHTML='';}};
  $('#s-copy').focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden){$('#modal').hidden=true;$('#modal').innerHTML='';}});
$('#stk-hd').src=STK['5'];
renderAll();

</script>
</body>
</html>
